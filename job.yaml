resources:
  jobs:
    CineData_Analytics_Pipeline:
      name: CineData_Analytics_Pipeline
      schedule:
        quartz_cron_expression: 3 0 8 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_silver
          depends_on:
            - task_key: to_bronze
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_gold
          depends_on:
            - task_key: to_silver
          notebook_task:
            notebook_path: /Workspace/Users/jtc@cesar.school/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
